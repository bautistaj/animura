# Override para pruebas locales con Docker (sin Traefik).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# URLs:
#   http://localhost:3000/ar/
#   http://localhost:3000/ar/btaj-capas/
#   http://localhost:3000/ar/abismo-negro/
#   http://localhost:3000/artworks.json

services:
  btaj-ar:
    ports:
      - "3000:3000"
    networks:
      - traefik-public

networks:
  traefik-public:
    driver: bridge
    external: false
