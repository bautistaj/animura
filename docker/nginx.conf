server {
    listen 3000;
    root /app;
    index index.html;

    # ── MIME types críticos para WebAR ──────────────────────
    types {
        text/html                   html htm;
        application/javascript      js mjs;
        text/css                    css;
        application/json            json;
        image/jpeg                  jpg jpeg;
        image/png                   png;
        image/gif                   gif;
        image/svg+xml               svg;
        image/webp                  webp;

        video/mp4                   mp4;
        video/webm                  webm;
        video/quicktime             mov;

        application/octet-stream    mind;
    }

    # ── Cache para assets estáticos ─────────────────────────
    location ~* \.(js|mjs|css|woff2?|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(mp4|webm|mov|mind)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # ── Galería /ar/ ─────────────────────────────────────────
    location = /ar/ {
        try_files /ar/index.html =404;
    }

    # ── Viewer por obra: /ar/{slug}/ ─────────────────────────
    location ~ ^/ar/[^/]+/?$ {
        try_files $uri $uri/ /ar/viewer.html;
    }

    # ── 404 ──────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ── Archivos estáticos ────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Seguridad básica ─────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header Permissions-Policy      "camera=*";
}
