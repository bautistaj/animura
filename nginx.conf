server {
    listen 443 ssl http2;
    server_name bautistaj.dev;

    # SSL — Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/bautistaj.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bautistaj.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/btaj-ar;
    index index.html;

    # ── MIME types críticos para WebAR ──────────────────────
    types {
        text/html                   html htm;
        application/javascript      js mjs;
        text/css                    css;
        application/json            json;
        image/jpeg                  jpg jpeg;
        image/png                   png;
        image/gif                   gif;
        image/svg+xml               svg;
        image/webp                  webp;

        video/mp4                   mp4;
        video/webm                  webm;
        video/quicktime             mov;

        # MindAR image target
        application/octet-stream    mind;
    }

    # ── Cache para assets estáticos ─────────────────────────
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(mp4|webm|mov|mind)$ {
        expires 7d;
        add_header Cache-Control "public";
        # Permite seeking en videos (byte-range requests)
        add_header Accept-Ranges bytes;
    }

    # ── Galería /ar/ ─────────────────────────────────────────
    location = /ar/ {
        try_files /ar/index.html =404;
    }

    # ── Experiencia AR por obra: /ar/{slug}/ ─────────────────
    # Nginx sirve viewer.html para cualquier subruta de /ar/ que no sea
    # un archivo existente — el slug se lee del pathname en JS.
    location ~ ^/ar/[^/]+/?$ {
        try_files $uri $uri/ /ar/viewer.html;
    }

    # ── Raíz ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Seguridad básica ─────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Permissions-Policy "camera=*";
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name bautistaj.dev;
    return 301 https://$host$request_uri;
}
