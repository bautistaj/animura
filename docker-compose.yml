# Producción: buildea la imagen y la publica bajo
# https://bautistaj.dev/ar/  vía Traefik.
#
# Rutas que Traefik redirige a este contenedor (sin StripPrefix):
#   /ar            → galería y viewer por obra
#   /assets        → CSS, JS, libs, videos, targets (.mind)
#   /artworks.json → configuración de obras
#
# Las rutas /assets y /artworks.json son absolutas en el código
# (no llevan prefijo /ar) — por eso se enrutan aquí directamente
# sin quitar prefijo.  Nginx dentro del contenedor las sirve desde /app.
#
# Requisitos en el host: Traefik corriendo, red externa `traefik-public`.
#
# Deploy inicial / actualización de código:
#   git pull && sudo docker compose up -d --build
#
# Agregar obra nueva sin reconstruir imagen:
#   rsync -av assets/artworks/mi-obra/ usuario@host:/ruta/btaj-ar/assets/artworks/mi-obra/
#   scp artworks.json usuario@host:/ruta/btaj-ar/artworks.json
#   sudo docker compose restart btaj-ar

services:
  btaj-ar:
    build:
      context: .
      dockerfile: Dockerfile
    image: btaj-ar:latest
    container_name: btaj-ar
    restart: unless-stopped
    volumes:
      # Bind-mount de obras: permite agregar artwork nuevo con rsync
      # sin necesidad de reconstruir la imagen.
      - ./artworks.json:/app/artworks.json:ro
      - ./assets/artworks:/app/assets/artworks:ro
    labels:
      - "traefik.enable=true"
      # Las tres rutas que este servicio necesita — sin StripPrefix
      # porque el código usa rutas absolutas desde la raíz del dominio.
      - "traefik.http.routers.btaj-ar.rule=Host(`bautistaj.dev`) && (PathPrefix(`/ar`) || PathPrefix(`/assets`) || Path(`/artworks.json`))"
      - "traefik.http.routers.btaj-ar.entrypoints=websecure"
      - "traefik.http.routers.btaj-ar.tls.certresolver=letsencrypt"
      - "traefik.http.services.btaj-ar.loadbalancer.server.port=3000"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
